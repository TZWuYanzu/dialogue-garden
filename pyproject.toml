[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-garden"
version = "0.1.0"
description = "Local-first dialogue and knowledge repository."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["zstandard"]

[project.scripts]
garden = "tools.cli:main"

[tool.setuptools.packages.find]
include = ["tools*"]
