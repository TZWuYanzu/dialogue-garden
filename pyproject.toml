[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-garden"
version = "0.1.0"
description = "Local-first dialogue and knowledge repository."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zstandard",
    "anthropic>=0.52",
    "pydantic>=2.0",
    "python-dotenv",
    "click>=8.0",
]

[project.scripts]
garden = "tools.cli:main"

[tool.setuptools.packages.find]
include = ["tools*"]
